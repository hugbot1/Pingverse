<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechChat</title>
  <style>
    /* ... (Use your original CSS styles here) ... */
    :root { --bg: #0f0f0f; --surface: #1a1a1a; --text: #f0f0f0; --accent: #3b82f6; --danger: #ef4444; --green: #22c55e; }
    body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; }
    #auth-screen, #chat-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .card { background: var(--surface); padding: 2rem; border-radius: 12px; width: 320px; border: 1px solid #333; }
    .tabs { display: flex; gap: 10px; margin-bottom: 1rem; }
    .tab { cursor: pointer; opacity: 0.6; background: none; border: none; color: white; font-weight: bold; }
    .tab.active { opacity: 1; border-bottom: 2px solid var(--accent); }
    .field { margin-bottom: 1rem; width: 100%; }
    input { width: 100%; padding: 8px; box-sizing: border-box; background: #000; border: 1px solid #444; color: white; border-radius: 4px; }
    .btn { width: 100%; padding: 10px; background: var(--accent); border: none; color: white; font-weight: bold; cursor: pointer; border-radius: 4px; }
    .btn:disabled { opacity: 0.5; }
    #chat-screen { display: none; }
    #messages { flex: 1; width: 100%; overflow-y: auto; padding: 1rem; box-sizing: border-box; }
    .msg { margin-bottom: 10px; padding: 8px; background: #222; border-radius: 4px; max-width: 80%; }
    .msg.own { align-self: flex-end; background: #1e3a8a; }
    .alert { color: var(--danger); font-size: 0.8rem; margin-bottom: 1rem; display: none; }
    .key-zone { border: 2px dashed #444; padding: 10px; text-align: center; cursor: pointer; font-size: 0.8rem; }
    .key-zone.ok { border-color: var(--green); color: var(--green); }
  </style>
</head>
<body>

<div id="auth-screen">
  <div class="card">
    <h1>TechChat</h1>
    <div class="tabs">
      <button id="tab-login" class="tab active" onclick="switchTab('login')">Sign In</button>
      <button id="tab-register" class="tab" onclick="switchTab('register')">Register</button>
    </div>
    <div id="auth-alert" class="alert"></div>
    <div class="field"><input id="f-username" type="text" placeholder="Username"></div>
    <div class="field"><input id="f-password" type="password" placeholder="Password"></div>
    <div class="field">
      <div class="key-zone" id="key-zone">
        <input type="file" id="key-input" style="display:none" onchange="handleFile(this.files)">
        <span id="key-label">Click to upload Key File</span>
      </div>
    </div>
    <button id="auth-btn" class="btn" onclick="doAuth()">Sign In</button>
  </div>
</div>

<div id="chat-screen">
  <div style="padding:10px; background:#111; width:100%; display:flex; justify-content:space-between">
    <span id="user-badge">...</span>
    <button onclick="doSignOut()">Logout</button>
  </div>
  <div id="messages"></div>
  <div style="padding:10px; display:flex; width:100%; box-sizing:border-box">
    <input id="msg-input" placeholder="Type a message..." style="flex:1">
    <button onclick="doSend()" style="width:60px">Send</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  let authMode = 'login';
  let keyB64 = null;
  let socket = null;

  const authBtn = document.getElementById('auth-btn');
  const authAlert = document.getElementById('auth-alert');

  function switchTab(mode) {
    authMode = mode;
    document.getElementById('tab-login').classList.toggle('active', mode === 'login');
    document.getElementById('tab-register').classList.toggle('active', mode === 'register');
    authBtn.innerText = mode === 'login' ? 'Sign In' : 'Create Account';
  }

  document.getElementById('key-zone').onclick = () => document.getElementById('key-input').click();

  function handleFile(files) {
    const reader = new FileReader();
    reader.onload = e => {
      keyB64 = e.target.result.split(',')[1];
      document.getElementById('key-zone').classList.add('ok');
      document.getElementById('key-label').innerText = "✓ Key Loaded";
    };
    reader.readAsDataURL(files[0]);
  }

  async function doAuth() {
    const username = document.getElementById('f-username').value;
    const password = document.getElementById('f-password').value;
    if (!username || !password || !keyB64) return alert("Fill all fields and upload Key File");

    authBtn.disabled = true;
    try {
      const res = await fetch('/auth/' + authMode, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password, keyFile: keyB64 })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);

      sessionStorage.setItem('tc_token', data.token);
      enterChat(data.token, data.username);
    } catch (err) {
      authAlert.innerText = err.message;
      authAlert.style.display = 'block';
    } finally {
      authBtn.disabled = false;
    }
  }

  function enterChat(token, username) {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('chat-screen').style.display = 'flex';
    document.getElementById('user-badge').innerText = username;

    socket = io({ auth: { token } });
    socket.on('welcome', ({ history }) => {
      document.getElementById('messages').innerHTML = '';
      history.forEach(appendMessage);
    });
    socket.on('chat message', appendMessage);
    socket.on('kicked', (msg) => { alert(msg); doSignOut(); });
  }

  function appendMessage(msg) {
    const div = document.createElement('div');
    div.className = 'msg';
    div.innerText = `${msg.user}: ${msg.msg}`;
    const container = document.getElementById('messages');
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  }

  function doSend() {
    const input = document.getElementById('msg-input');
    if (!input.value.trim()) return;
    socket.emit('chat message', input.value);
    input.value = '';
  }

  function doSignOut() {
    sessionStorage.removeItem('tc_token');
    location.reload();
  }

  window.onload = () => {
    const token = sessionStorage.getItem('tc_token');
    if (token) enterChat(token, 'User');
  }
</script>
</body>
</html>
