<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechChat</title>
  <style>
    :root {
      --bg: #0b0e11; --sidebar: #15191c; --surface: #1e2327; --text: #e9edef;
      --text-muted: #8696a0; --accent: #00a884; --own-msg: #005c4b; --danger: #f15c5c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }

    #auth-screen { flex: 1; display: flex; align-items: center; justify-content: center; }
    .card { background: var(--surface); padding: 2rem; border-radius: 12px; width: 350px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 1rem; border-bottom: 1px solid #333; }
    .tab { flex: 1; padding: 10px; cursor: pointer; background: none; border: none; color: var(--text-muted); font-weight: bold; }
    .tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
    input, select { width: 100%; padding: 10px; margin-bottom: 10px; background: #2a3338; border: 1px solid #444; color: white; border-radius: 6px; outline: none; }
    .btn { width: 100%; padding: 12px; background: var(--accent); border: none; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .key-zone { border: 2px dashed #444; padding: 10px; text-align: center; border-radius: 6px; cursor: pointer; margin-bottom: 10px; font-size: 0.8rem; }
    .key-zone.ok { border-color: var(--accent); color: var(--accent); }

    #chat-screen { display: none; flex: 1; height: 100vh; }
    .sidebar { width: 280px; background: var(--sidebar); display: flex; flex-direction: column; border-right: 1px solid #222; }
    .sidebar-header { padding: 15px; border-bottom: 1px solid #222; }
    .user-list { flex: 1; overflow-y: auto; }
    .user-item { padding: 10px 20px; font-size: 0.9rem; border-bottom: 1px solid #1a1e21; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: background 0.2s; }
    .user-item:hover { background: #2a3338; }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    
    .main-chat { flex: 1; display: flex; flex-direction: column; position: relative; }
    .chat-header { padding: 15px 20px; background: var(--sidebar); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; }
    
    #broadcast-bar { padding: 8px; background: #2a3338; text-align: center; font-weight: bold; font-size: 0.8rem; border-bottom: 1px solid #444; display: none; }
    @keyframes flash-red { 0%, 100% { background: #2a3338; } 50% { background: var(--danger); } }
    .important-flash { animation: flash-red 1s 5; }

    #admin-tools { padding: 15px; background: #000; border-top: 1px solid #333; display: none; }
    .admin-label { display: flex; align-items: center; gap: 8px; cursor: pointer; margin-bottom: 10px; color: var(--text-muted); }

    /* Feature 4: Message Wrap Fix */
    #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 10px; border-radius: 8px; max-width: 85%; background: var(--surface); align-self: flex-start; word-wrap: break-word; overflow-wrap: break-word; }
    .msg.own { align-self: flex-end; background: var(--own-msg); }
    .msg-content { display: block; white-space: pre-wrap; margin-top: 5px; }
    
    .msg-meta { font-size: 0.7rem; color: var(--accent); font-weight: bold; display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .msg-time { font-size: 0.6rem; color: var(--text-muted); margin-top: 5px; text-align: right; }

    /* Reply UI */
    .reply-box { font-size: 0.75rem; background: rgba(0,0,0,0.3); border-left: 3px solid var(--accent); padding: 5px 10px; margin-bottom: 8px; border-radius: 4px; cursor: pointer; }
    .reply-preview-area { background: #1e2327; padding: 10px 20px; border-top: 1px solid #333; display: none; justify-content: space-between; align-items: center; }

    /* Settings Modal */
    #settings-modal { display: none; position: fixed; z-index: 1000; left:0; top:0; width:100%; height:100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; }
    .modal-content { background: var(--surface); padding: 2rem; border-radius: 12px; width: 350px; border: 1px solid #333; }

    #back-btn { display: none; background: none; border: 1px solid var(--accent); color: var(--accent); padding: 4px 10px; border-radius: 4px; cursor: pointer; margin-right: 12px; font-size: 0.8rem; }
  </style>
</head>
<body>

<div id="settings-modal">
  <div class="modal-content">
    <h3 style="margin-bottom:15px">Account Settings</h3>
    <div id="settings-alert" class="alert"></div>
    <label style="font-size:0.7rem; color:var(--text-muted)">Change Username</label>
    <input id="new-username" type="text" placeholder="New Username...">
    <label style="font-size:0.7rem; color:var(--text-muted)">Change Password</label>
    <input id="new-password" type="password" placeholder="New Password...">
    <button class="btn" onclick="saveSettings()">Update Account</button>
    <button class="btn" style="background:var(--danger); margin-top:10px" onclick="deleteAccount()">Delete Account & Data</button>
    <button class="btn" style="background:none; border:1px solid #444; margin-top:10px" onclick="closeSettings()">Cancel</button>
  </div>
</div>

<div id="auth-screen">
  <div class="card">
    <div class="tabs"><button id="tab-login" class="tab active" onclick="switchTab('login')">LOGIN</button><button id="tab-register" class="tab" onclick="switchTab('register')">REGISTER</button></div>
    <div id="auth-alert" class="alert"></div>
    <input id="f-username" type="text" placeholder="Username">
    <input id="f-password" type="password" placeholder="Password">
    <div class="key-zone" id="key-zone" onclick="document.getElementById('key-input').click()">
      <input type="file" id="key-input" style="display:none" onchange="handleFile(this.files)">
      <span id="key-label">Upload Key File</span>
    </div>
    <button id="auth-btn" class="btn" onclick="doAuth()">Sign In</button>
  </div>
</div>

<div id="chat-screen">
  <div class="sidebar">
    <div class="sidebar-header"><input id="user-search" placeholder="Search people..." oninput="filterUsers()"></div>
    <div id="user-list" class="user-list"></div>
    
    <div id="admin-tools">
      <p style="font-size:0.65rem; color:var(--accent); margin-bottom:8px; font-weight:bold;">MANAGEMENT</p>
      <input id="bc-input" placeholder="Top message..." style="font-size:0.75rem; padding:8px; margin-bottom:8px;">
      <label class="admin-label" style="font-size:0.75rem;"><input type="checkbox" id="bc-check"> <span>Important</span></label>
      <button class="btn" onclick="updateBroadcast()" style="padding:8px; font-size:0.75rem;">Set Message</button>
    </div>

    <div style="padding:15px; border-top:1px solid #222; display:flex; justify-content:space-between; align-items: center;">
      <span id="user-badge" onclick="openSettings()" style="color:var(--accent); font-weight: bold; cursor:pointer" title="Settings">...</span>
      <button onclick="doSignOut()" style="background:none; border:none; color:var(--danger); cursor:pointer; font-size: 0.8rem;">Logout</button>
    </div>
  </div>

  <div class="main-chat">
    <div class="chat-header">
      <div style="display:flex; align-items:center">
        <button id="back-btn" onclick="exitPrivate()">← Back</button>
        <span id="chat-title">Global Chat</span>
      </div>
      <button onclick="toggleSearch()" style="background:none; border:1px solid var(--accent); color:var(--accent); padding:4px 8px; border-radius:4px; cursor:pointer">Search</button>
    </div>
    
    <div id="broadcast-bar"><span id="bc-text"></span></div>

    <div id="search-panel" class="search-panel" style="display:none; padding:10px; background:var(--surface)">
      <input id="s-content" placeholder="Content..." oninput="applyFilter()" style="margin-bottom:5px">
      <input id="s-user" placeholder="User..." oninput="applyFilter()" style="margin-bottom:5px">
      <select id="s-sort" onchange="applyFilter()"><option value="new">Newest First</option><option value="old">Oldest First</option></select>
    </div>

    <div id="messages"></div>

    <div id="reply-preview" class="reply-preview-area">
      <span id="reply-text" style="font-size:0.75rem; color:var(--text-muted)"></span>
      <span onclick="cancelReply()" style="cursor:pointer; color:var(--danger)">✕</span>
    </div>

    <form class="input-area" onsubmit="event.preventDefault(); doSend();">
      <input id="msg-input" placeholder="Type a message..." autocomplete="off" style="margin-bottom:0">
      <button class="btn" type="submit" style="width:80px">Send</button>
    </form>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="./client.js"></script>
</body>
</html>
