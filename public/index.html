<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechChat | Secured</title>
  <style>
    :root { --bg: #0b0e11; --sidebar: #15191c; --surface: #1e2327; --text: #e9edef; --accent: #00a884; --own-msg: #005c4b; --danger: #f15c5c; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }

    #auth-screen { flex: 1; display: flex; align-items: center; justify-content: center; z-index: 100; background: var(--bg); }
    .card { background: var(--surface); padding: 2rem; border-radius: 12px; width: 350px; }
    input, select { width: 100%; padding: 10px; margin-bottom: 10px; background: #2a3338; border: 1px solid #444; color: white; border-radius: 6px; outline: none; }
    .btn { width: 100%; padding: 12px; background: var(--accent); border: none; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .key-zone { border: 2px dashed #444; padding: 15px; text-align: center; border-radius: 6px; cursor: pointer; margin-bottom: 10px; }
    .key-zone.ok { border-color: var(--accent); color: var(--accent); }

    #chat-screen { display: none; flex: 1; }
    .sidebar { width: 280px; background: var(--sidebar); display: flex; flex-direction: column; border-right: 1px solid #222; }
    .main-chat { flex: 1; display: flex; flex-direction: column; position: relative; }

    #broadcast-bar { padding: 12px; text-align: center; font-weight: bold; font-size: 0.9rem; border-bottom: 1px solid #333; }
    @keyframes flash { 0%, 100% { background: #333; } 50% { background: var(--danger); } }
    .urgent { animation: flash 1s 5; }

    #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
    .msg { padding: 10px 14px; border-radius: 8px; max-width: 70%; background: var(--surface); position: relative; }
    .msg.own { align-self: flex-end; background: var(--own-msg); }
    .del-btn { color: var(--danger); cursor: pointer; margin-left: 10px; font-size: 0.8rem; border: none; background: none; }
    .msg-time { font-size: 0.6rem; opacity: 0.6; float: right; margin-top: 4px; margin-left: 8px; }

    .admin-panel { padding: 15px; background: #000; border-top: 1px solid #333; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  </style>
</head>
<body>

<div id="auth-screen">
  <div class="card">
    <div style="display:flex; margin-bottom: 20px;">
      <button onclick="authMode='login'" style="flex:1; background:none; border:none; color:white; cursor:pointer;">Login</button>
      <button onclick="authMode='register'" style="flex:1; background:none; border:none; color:white; cursor:pointer;">Join</button>
    </div>
    <input id="f-user" placeholder="Username">
    <input id="f-pass" type="password" placeholder="Password">
    <div class="key-zone" id="key-zone" onclick="document.getElementById('k-in').click()">
      <input type="file" id="k-in" style="display:none" onchange="handleFile(this.files)">
      <span id="k-lab">Upload Security Key</span>
    </div>
    <button class="btn" onclick="doAuth()">Verify & Enter</button>
  </div>
</div>

<div id="chat-screen">
  <div class="sidebar">
    <div style="padding:15px;"><input id="u-search" placeholder="Search Users..." oninput="filterUsers()"></div>
    <div id="user-list" style="flex:1; overflow-y:auto;"></div>
    
    <div id="admin-tools" class="admin-panel" style="display:none;">
      <p style="color:var(--accent); font-size:0.7rem; margin-bottom:5px;">ADMIN BROADCAST</p>
      <input id="bc-msg" placeholder="Message..." style="font-size:0.8rem;">
      <label style="font-size:0.7rem;"><input type="checkbox" id="bc-urg"> Important</label>
      <button class="btn" onclick="sendBC()" style="padding:5px; margin-top:5px; font-size:0.7rem;">Broadcast</button>
    </div>

    <div style="padding:15px; border-top:1px solid #333; display:flex; justify-content:space-between; align-items:center;">
      <span id="my-name">...</span>
      <button onclick="location.reload()" style="background:none; border:none; color:var(--danger); cursor:pointer;">Logout</button>
    </div>
  </div>

  <div class="main-chat">
    <div id="broadcast-bar" style="display:none;"><span id="bc-txt"></span></div>
    <div style="padding:15px; border-bottom:1px solid #222; font-weight:bold;">Chat</div>
    <div id="messages"></div>
    <form style="padding:20px; display:flex; gap:10px;" onsubmit="event.preventDefault(); doSend();">
      <input id="m-in" placeholder="Type a message..." autocomplete="off" style="margin:0;">
      <button class="btn" style="width:80px;">Send</button>
    </form>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="./client.js"></script>
</body>
</html>
