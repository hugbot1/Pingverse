<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f4;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: #333;
      color: #fff;
      padding: 1rem;
      text-align: center;
    }
    #username {
      font-size: 0.9em;
      opacity: 0.8;
    }
    #chat {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
      background: #fff;
      background-color: #222;
    }
    .message {
      margin: 0.5rem 0;
      padding: 0.5rem 1rem;
      background: #e1f5fe;
      border-radius: 1rem;
      max-width: 80%;
    }
    footer {
      display: flex;
      padding: 1rem;
      background: #eee;
      gap: 10px;
      background-color: #222;
    }
    #message {
  font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Roboto","Oxygen","Ubuntu","Cantarell","Fira Sans","Droid Sans","Helvetica Neue",sans-serif;
  color: #fff;
  background-color: rgb(28,28,30);
  box-shadow: 0 0 .4vw rgba(0,0,0,0.5), 0 0 0 .15vw transparent;
  border-radius: 0.4vw;
  border: none;
  outline: none;
  padding: 0.4vw;
  width: 100%;
  transition: .4s;;
  border-radius: 10px;
    }
    #message:hover {
      box-shadow: 0 0 0 .15vw rgba(135, 207, 235, 0.186);
    }
    #message:focus {
      box-shadow: 0 0 0 .15vw skyblue;
    }
button {
  font-family: inherit;
  font-size: 18px;
  background: linear-gradient(to bottom, #4dc7d9 0%,#66a6ff 100%);
  color: white;
  padding: 0.8em 1.2em;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  border-radius: 25px;
  box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.2);
  transition: all 0.3s;
}

button:hover {
  transform: translateY(-3px);
  box-shadow: 0px 8px 15px rgba(0, 0, 0, 0.3);
  padding: 0em;
  background: linear-gradient(to bottom, #5bd9ec 0%,#97c3ff 100%);
  cursor: pointer;
}

button:active {
  transform: scale(0.95);
  box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.2);
}

button span {
  display: block;
  margin-left: 0.4em;
  transition: all 0.3s;
}

button:hover span {
  scale: 0;
  font-size: 0%;
  opacity: 0;
  transition: all 0.5s;
}

button svg {
  width: 18px;
  height: 18px;
  fill: white;
  transition: all 0.3s;
}

button .svg-wrapper {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background-color: rgba(255, 255, 255, 0.2);
  transition: all 0.3s;
}

button:hover .svg-wrapper {
  background-color: rgba(43, 169, 228, 0.897);
  width: 54px;
  height: 54px;
}

button:hover svg {
  width: 25px;
  height: 25px;
  margin-right: 5px;
  transform: rotate(45deg);
}
  </style>
</head>
<body>
  <header>
    <h1>Chat</h1>
    <div id="username">Connecting...</div>
  </header>
  <div id="chat"></div>
  <footer>
    <input id="message" autocomplete="off" placeholder="Type your message..." />
<button onclick="sendMessage()">
  <div class="svg-wrapper-1">
    <div class="svg-wrapper">
      <svg height="24" width="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 0h24v24H0z" fill="none"></path>
        <path d="M1.946 9.315c-.522-.174-.527-.455.01-.634l19.087-6.362c.529-.176.832.12.684.638l-5.454 19.086c-.15.529-.455.547-.679.045L12 14l6-8-8 6-8.054-2.685z" fill="currentColor"></path>
      </svg>
    </div>
  </div>
  <span>Send</span>
</button>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const chat = document.getElementById('chat');
    const messageInput = document.getElementById('message');
    const usernameDisplay = document.getElementById('username');

    socket.on('welcome', username => {
      usernameDisplay.textContent = "You are " + username;
    });

    socket.on('chat message', msg => {
      const item = document.createElement('div');
      item.className = 'message';
      item.textContent = msg;
      chat.appendChild(item);
      chat.scrollTop = chat.scrollHeight;
    });

    function sendMessage() {
      const msg = messageInput.value;
      if (msg.trim()) {
        socket.emit('chat message', msg);
        messageInput.value = '';
      }
    }

    messageInput.addEventListener("keyup", e => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
