<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechChat | Managed</title>
  <style>
    :root {
      --bg: #0b0e11; --sidebar: #15191c; --surface: #1e2327; --text: #e9edef;
      --text-muted: #8696a0; --accent: #00a884; --own-msg: #005c4b; --danger: #f15c5c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }

    /* AUTH SCREEN */
    #auth-screen { flex: 1; display: flex; align-items: center; justify-content: center; background: var(--bg); position: fixed; inset: 0; z-index: 999; }
    .card { background: var(--surface); padding: 2.5rem; border-radius: 12px; width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .tabs { display: flex; gap: 10px; margin-bottom: 1.5rem; border-bottom: 1px solid #333; }
    .tab { flex: 1; padding: 12px; cursor: pointer; background: none; border: none; color: var(--text-muted); font-weight: bold; transition: 0.3s; }
    .tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
    input, select { width: 100%; padding: 12px; margin-bottom: 12px; background: #2a3338; border: 1px solid #444; color: white; border-radius: 6px; outline: none; }
    .btn { width: 100%; padding: 12px; background: var(--accent); border: none; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
    .btn:hover { opacity: 0.9; }
    .key-zone { border: 2px dashed #444; padding: 15px; text-align: center; border-radius: 6px; cursor: pointer; margin-bottom: 15px; transition: 0.3s; }
    .key-zone.ok { border-color: var(--accent); color: var(--accent); background: rgba(0, 168, 132, 0.05); }

    /* CHAT SCREEN */
    #chat-screen { display: none; flex: 1; height: 100vh; }
    .sidebar { width: 300px; background: var(--sidebar); display: flex; flex-direction: column; border-right: 1px solid #222; }
    .main-chat { flex: 1; display: flex; flex-direction: column; background: #0c1013; }

    #broadcast-bar { padding: 12px; text-align: center; font-weight: bold; font-size: 0.9rem; color: white; transition: 0.5s; }
    @keyframes flash-red { 0%, 100% { background: #2a3338; } 50% { background: var(--danger); } }
    .urgent { animation: flash-red 1s 5; }

    #messages { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 12px; }
    .msg { padding: 10px 14px; border-radius: 8px; max-width: 75%; background: var(--surface); position: relative; word-wrap: break-word; }
    .msg.own { align-self: flex-end; background: var(--own-msg); }
    .msg-meta { font-size: 0.75rem; color: var(--accent); font-weight: bold; margin-bottom: 4px; display: flex; justify-content: space-between; }
    .del-btn { color: var(--danger); cursor: pointer; border: none; background: none; font-size: 0.9rem; padding: 0 5px; }
    .msg-time { font-size: 0.65rem; color: var(--text-muted); float: right; margin-top: 6px; margin-left: 10px; }

    .admin-panel { padding: 15px; background: #000; border-top: 1px solid #333; }
    .status-dot { width: 9px; height: 9px; border-radius: 50%; }
    .alert { background: rgba(241, 92, 92, 0.1); color: var(--danger); padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 0.85rem; display: none; }
  </style>
</head>
<body>

<div id="auth-screen">
  <div class="card">
    <div class="tabs">
      <button id="tab-login" class="tab active" onclick="switchAuth('login')">LOGIN</button>
      <button id="tab-reg" class="tab" onclick="switchAuth('register')">REGISTER</button>
    </div>
    <div id="auth-alert" class="alert"></div>
    <input id="f-user" type="text" placeholder="Username">
    <input id="f-pass" type="password" placeholder="Password">
    <div class="key-zone" id="key-zone" onclick="document.getElementById('k-in').click()">
      <input type="file" id="k-in" style="display:none" onchange="handleFile(this.files)">
      <span id="k-lab">Upload Security Key File</span>
    </div>
    <button class="btn" onclick="doAuth()">ACCESS SYSTEM</button>
  </div>
</div>

<div id="chat-screen">
  <div class="sidebar">
    <div style="padding:20px; border-bottom: 1px solid #222;">
      <input id="u-search" placeholder="Search people..." oninput="filterUsers()" style="margin:0;">
    </div>
    <div id="user-list" style="flex:1; overflow-y:auto;"></div>
    
    <div id="admin-tools" class="admin-panel" style="display:none;">
      <p style="color:var(--accent); font-size:0.7rem; font-weight:bold; margin-bottom:8px; text-transform:uppercase;">Admin Broadcast</p>
      <input id="bc-msg" placeholder="Message content..." style="font-size:0.8rem;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <label style="font-size:0.7rem; color:var(--text-muted);"><input type="checkbox" id="bc-urg"> Important Check</label>
        <button class="btn" onclick="sendBroadcast()" style="width:80px; padding:6px; font-size:0.7rem;">SET</button>
      </div>
    </div>

    <div style="padding:15px; border-top:1px solid #333; display:flex; justify-content:space-between; align-items:center;">
      <span id="my-name-display" style="font-weight:bold; color:var(--accent);">...</span>
      <button onclick="logout()" style="background:none; border:none; color:var(--danger); cursor:pointer; font-size:0.8rem;">Log Out</button>
    </div>
  </div>

  <div class="main-chat">
    <div id="broadcast-bar" style="display:none;"><span id="bc-display-text"></span></div>
    <div style="padding:15px 25px; border-bottom:1px solid #222; font-weight:bold; display:flex; justify-content:space-between;">
      <span>Chat Console</span>
      <span id="conn-status" style="color:var(--accent); font-size:0.8rem;">● Online</span>
    </div>
    <div id="messages"></div>
    <form style="padding:20px; display:flex; gap:12px; background: var(--sidebar);" onsubmit="event.preventDefault(); doSend();">
      <input id="m-in" placeholder="Type a secure message..." autocomplete="off" style="margin:0;">
      <button class="btn" style="width:100px;">SEND</button>
    </form>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="./client.js"></script>
</body>
</html>
